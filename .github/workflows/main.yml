name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android project files
        run: |
          flutter create --project-name burmese_podcast_app --org com.waiyan --platforms=android .
          find android -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' {} +

      - name: Force Android SDK 35 across all plugins
        run: |
          python3 -c "
          import os

          # android/build.gradle သို့မဟုတ် settings.gradle ထဲ subprojects အားလုံးအတွက် SDK 35 သတ်မှတ်ခြင်း
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'a') as f:
                  f.write('''
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                      }
                  }
              }
          }
          ''')
              print('Patched root build.gradle')

          # app/build.gradle သို့မဟုတ် app/build.gradle.kts ပြင်ဆင်ခြင်း
          for p in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      txt = f.read()
                  txt = txt.replace('flutter.compileSdkVersion', '35')
                  txt = txt.replace('flutter.targetSdkVersion', '35')
                  with open(p, 'w') as f:
                      f.write(txt)
                  print(f'Patched: {p}')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BurmesePodcastApp-Release
          path: build/app/outputs/flutter-apk/app-release.apk
