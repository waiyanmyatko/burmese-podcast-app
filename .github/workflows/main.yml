name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Folder
        run: |
          flutter create . --platforms=android --org com.waiyan.burmesepodcast

      - name: Configure Android minSdkVersion
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle || true

      - name: Download Whisper Offline Model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burmese-podcast-app
          path: build/app/outputs/flutter-apk/app-release.apk
