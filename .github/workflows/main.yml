name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Recreate Android Project Folder
        run: |
          flutter create . --platforms=android --org com.waiyan.burmesepodcast

      - name: Configure Android SDK versions
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true

      - name: Download Whisper Offline Model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Install Dependencies & Check Dart Errors
        run: |
          flutter pub get
          flutter analyze || true

      - name: Build Debug APK
        run: |
          flutter build apk --debug

      - name: Prepare APK for Artifact
        run: |
          mkdir -p output_apk
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} output_apk/ \; || find . -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burmese-podcast-app
          path: output_apk/
