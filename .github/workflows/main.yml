name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android project files
        run: |
          flutter create --project-name burmese_podcast_app --org com.waiyan --platforms=android .
          find android -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' {} +

      - name: Set Android SDK 36
        run: |
          python3 -c "
          import os

          # app/build.gradle.kts (Kotlin DSL) ကို compileSdk 36 သို့ တိုက်ရိုက် ပြောင်းလဲခြင်း
          kts = 'android/app/build.gradle.kts'
          if os.path.exists(kts):
              with open(kts, 'r') as f:
                  data = f.read()
              data = data.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              data = data.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
              with open(kts, 'w') as f:
                  f.write(data)
              print('Patched build.gradle.kts to SDK 36')

          # app/build.gradle (Groovy DSL) ရှိခဲ့ပါက ပြောင်းလဲခြင်း
          groovy = 'android/app/build.gradle'
          if os.path.exists(groovy):
              with open(groovy, 'r') as f:
                  data = f.read()
              data = data.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              data = data.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 36')
              with open(groovy, 'w') as f:
                  f.write(data)
              print('Patched build.gradle to SDK 36')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BurmesePodcastApp-Release
          path: build/app/outputs/flutter-apk/app-release.apk
