name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Folder
        run: |
          flutter create . --platforms=android --org com.waiyan.burmesepodcast

      - name: Accept All Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          mkdir -p "$ANDROID_SDK_ROOT/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479791eab51dcfd5987e8701e6b0e826" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a33ee13ef6102140781e0479965" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Force Fix minSdkVersion 24 & compileSdk 34
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true

      - name: Download Whisper Offline Model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burmese-podcast-app
          path: build/app/outputs/flutter-apk/app-release.apk
