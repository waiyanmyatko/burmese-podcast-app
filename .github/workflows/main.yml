name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Clean pubspec.yaml & Whisper Model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          rm -f pubspec.lock
          cat << 'EOF' > pubspec.yaml
          name: burmese_podcast
          description: Burmese Podcast Studio
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/models/ggml-tiny.bin
          EOF

      - name: Clean & Recreate Android Project Folder
        run: |
          rm -rf android test
          flutter pub get
          flutter create . --platforms=android --org com.waiyan.burmesepodcast

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: Build Debug APK
        run: |
          set +e
          flutter build apk --debug > build_raw.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=================== DETAILED ERROR START ==================="
            grep -A 25 "\* What went wrong:" build_raw.log || true
            echo "============================================================"
            tail -n 50 build_raw.log
            exit $STATUS
          fi

      - name: Prepare APK for Artifact
        run: |
          mkdir -p output_apk
          find build/ -name "*.apk" -type f -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burmese-podcast-app
          path: output_apk/
