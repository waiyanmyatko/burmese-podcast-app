name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept All Android SDK & NDK Licenses
        run: |
          for SDK_DIR in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/usr/local/lib/android/sdk"; do
            if [ -d "$SDK_DIR" ]; then
              mkdir -p "$SDK_DIR/licenses"
              printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479791eab51dcfd5987e8701e6b0e826" > "$SDK_DIR/licenses/android-sdk-license"
              printf "84831b9409646a33ee13ef6102140781e0479965" > "$SDK_DIR/licenses/android-sdk-preview-license"
              printf "601085b94cd77f0b54ff8640695709915000ce0d" > "$SDK_DIR/licenses/android-googletv-license"
              printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$SDK_DIR/licenses/google-gdk-license"
              printf "e9acab587f1749a4f1f61866fe34365b28ccfb8f" > "$SDK_DIR/licenses/mips-android-sysimage-license"
            fi
          done
          yes | flutter doctor --android-licenses || true

      - name: Recreate Android Project Folder
        run: |
          flutter create . --platforms=android --org com.waiyan.burmesepodcast

      - name: Fix Android SDK Versions
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true

      - name: Download Whisper Offline Model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burmese-podcast-app
          path: build/app/outputs/flutter-apk/app-debug.apk
