name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Project, Native Speech & TTS Engines, and WY Gold App Icon
        run: |
          rm -rf android test pubspec.lock
          cat << 'EOF' > pubspec.yaml
name: burmese_podcast
description: WY Podcast Studio
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
EOF

          flutter pub get
          flutter create . --platforms=android --org com.waiyan.burmesepodcast

          # Update Android Manifest (App Name, Icons & TTS Queries)
          sed -i 's/android:label="burmese_podcast"/android:label="WY'\''s PODCAST"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/wy_launcher" android:roundIcon="@mipmap\/wy_launcher"/g' android/app/src/main/AndroidManifest.xml
          
          # Insert Storage Permissions and TTS Intent Query into AndroidManifest.xml
          python3 - << 'EOF'
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          
          queries = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          """
          content = content.replace('<application', queries + '\n    <application')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          EOF

          rm -rf android/app/src/main/res/mipmap-anydpi*
          rm -f android/app/src/main/res/drawable*/ic_launcher*
          pip install pillow

          # Generate Native Android Kotlin Engine (File Picker + Native Android TTS with SynthesizeToFile)
          python3 - << 'EOF'
          import glob

          kt_code = """import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream
          import java.util.HashMap
          import java.util.Locale

          class MainActivity: FlutterActivity(), TextToSpeech.OnInitListener {
              private val CHANNEL = "com.waiyan.burmesepodcast/file_picker"
              private var pendingResult: MethodChannel.Result? = null
              private val PICK_FILE_CODE = 9001
              private var tts: TextToSpeech? = null
              private var isTtsReady = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  tts = TextToSpeech(this, this)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "pickFile" -> {
                              pendingResult = result
                              val mimeType = call.argument<String>("mimeType") ?: "*/*"
                              val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                  type = mimeType
                                  addCategory(Intent.CATEGORY_OPENABLE)
                              }
                              startActivityForResult(Intent.createChooser(intent, "Select File"), PICK_FILE_CODE)
                          }
                          "synthesizeTTS" -> {
                              val text = call.argument<String>("text") ?: ""
                              val speed = call.argument<Double>("speed") ?: 1.0
                              val outputPath = call.argument<String>("outputPath") ?: ""
                              
                              if (text.isEmpty() || outputPath.isEmpty()) {
                                  result.error("INVALID_ARGS", "Text or Output path is empty", null)
                                  return@setMethodCallHandler
                              }

                              if (!isTtsReady || tts == null) {
                                  result.error("TTS_NOT_READY", "Android Text-to-Speech Engine is initializing. Please retry.", null)
                                  return@setMethodCallHandler
                              }

                              tts?.setSpeechRate(speed.toFloat())
                              val destFile = File(outputPath)
                              if (destFile.parentFile?.exists() == false) {
                                  destFile.parentFile?.mkdirs()
                              }

                              val utteranceId = "WY_PODCAST_" + System.currentTimeMillis()
                              tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(utteranceId: String?) {}
                                  override fun onDone(id: String?) {
                                      runOnUiThread { result.success(destFile.absolutePath) }
                                  }
                                  override fun onError(id: String?) {
                                      runOnUiThread { result.error("TTS_SYNTH_FAIL", "Synthesis failed in TTS engine", null) }
                                  }
                              })

                              val params = Bundle()
                              val status = tts?.synthesizeToFile(text, params, destFile, utteranceId)
                              if (status != TextToSpeech.SUCCESS) {
                                  result.error("SYNTH_ERROR", "TTS synthesizeToFile call failed", null)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale.US
                      isTtsReady = true
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_FILE_CODE) {
                      val res = pendingResult
                      pendingResult = null
                      if (resultCode == Activity.RESULT_OK && data?.data != null) {
                          val uri: Uri = data.data!!
                          try {
                              var fileName = "selected_media"
                              contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                                  val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  if (nameIndex != -1 && cursor.moveToFirst()) {
                                      fileName = cursor.getString(nameIndex) ?: "selected_media"
                                  }
                              }
                              val outFile = File(cacheDir, fileName)
                              contentResolver.openInputStream(uri)?.use { input ->
                                  FileOutputStream(outFile).use { output ->
                                      input.copyTo(output)
                                  }
                              }
                              val map = HashMap<String, String>()
                              map["name"] = fileName
                              map["path"] = outFile.absolutePath
                              res?.success(map)
                          } catch (e: Exception) {
                              res?.error("READ_ERR", e.localizedMessage, null)
                          }
                      } else {
                          res?.success(null)
                      }
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          """

          main_files = glob.glob('android/**/MainActivity.kt', recursive=True)
          for mf in main_files:
              with open(mf, 'r') as f:
                  first_line = f.readline().strip()
              if not first_line.startswith('package '):
                  first_line = 'package com.waiyan.burmesepodcast.burmese_podcast'
              with open(mf, 'w') as f:
                  f.write(first_line + "\n\n" + kt_code)
          EOF

          # Generate High-Res WY Gold Icon
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          im = Image.new('RGBA', (512, 512), (18, 18, 20, 255))
          draw = ImageDraw.Draw(im)

          # Draw Gold Circular Ring
          draw.ellipse((20, 20, 492, 492), outline=(212, 175, 55, 255), width=14)

          # Draw Microphone / WY Logo Geometry
          # Mic Capsule
          draw.rounded_rectangle((216, 110, 296, 260), radius=40, fill=(212, 175, 55, 255))
          # Outer Cradle Arc
          draw.arc((176, 170, 336, 310), start=0, end=180, fill=(212, 175, 55, 255), width=12)
          # Stand Stem and Base
          draw.rectangle((250, 310, 262, 370), fill=(212, 175, 55, 255))
          draw.rounded_rectangle((200, 370, 312, 386), radius=8, fill=(212, 175, 55, 255))

          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          res_base = 'android/app/src/main/res'
          for folder, sz in sizes.items():
              p = os.path.join(res_base, folder)
              os.makedirs(p, exist_ok=True)
              resized = im.resize((sz, sz), Image.Resampling.LANCZOS)
              resized.save(os.path.join(p, 'ic_launcher.png'))
              resized.save(os.path.join(p, 'ic_launcher_round.png'))
              resized.save(os.path.join(p, 'wy_launcher.png'))
          EOF

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build Debug APK (ARM64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Prepare Single APK
        run: |
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-debug.apk output_apk/WY-Podcast.apk
          ls -lh output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wys-podcast-apk
          path: output_apk/WY-Podcast.apk
          compression-level: 0

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest output_apk/WY-Podcast.apk --title "WY's PODCAST APK" --notes "WY's PODCAST APK ကို တိုက်ရိုက်ဒေါင်းလုဒ်ဆွဲနိုင်ပါပြီ။"
