name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android project files
        run: |
          flutter create --project-name burmese_podcast_app --org com.waiyan --platforms=android .
          find android -name "AndroidManifest.xml" -exec sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' {} +

      - name: Configure Android SDK 35
        run: |
          # build.gradle သို့မဟုတ် build.gradle.kts ဖိုင်အားလုံးတွင် compileSdk 35 သတ်မှတ်ခြင်း
          python3 -c "
          import os, glob
          for path in glob.glob('android/**/*.gradle*', recursive=True):
              with open(path, 'r') as f:
                  content = f.read()
              new_content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
              new_content = new_content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
              new_content = new_content.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 35')
              new_content = new_content.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 35')
              if content != new_content:
                  with open(path, 'w') as f:
                      f.write(new_content)
                  print(f'Patched: {path}')
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BurmesePodcastApp-Release
          path: build/app/outputs/flutter-apk/app-release.apk
