name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Project, Native Engines, and App Icon
        run: |
          rm -rf android test pubspec.lock
          printf "name: burmese_podcast\ndescription: WY Podcast Studio\npublish_to: 'none'\nversion: 1.0.0+1\n\nenvironment:\n  sdk: '>=3.0.0 <4.0.0'\n\ndependencies:\n  flutter:\n    sdk: flutter\n\nflutter:\n  uses-material-design: true\n" > pubspec.yaml
          flutter pub get
          flutter create . --platforms=android --org com.waiyan.burmesepodcast
          sed -i 's/android:label="burmese_podcast"/android:label="WY'\''s PODCAST"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/wy_launcher" android:roundIcon="@mipmap\/wy_launcher"/g' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi*
          rm -f android/app/src/main/res/drawable*/ic_launcher*
          python3 - << 'EOF'
          import os, glob, struct, zlib

          mp = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(mp):
              with open(mp, 'r') as f:
                  mc = f.read()
              ex = '<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application'
              with open(mp, 'w') as f:
                  f.write(mc.replace('<application', ex, 1))

          kt = """import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream
          import java.util.HashMap
          import java.util.Locale

          class MainActivity: FlutterActivity(), TextToSpeech.OnInitListener {
              private val CHANNEL = "com.waiyan.burmesepodcast/file_picker"
              private var pendingResult: MethodChannel.Result? = null
              private val PICK_CODE = 9001
              private var tts: TextToSpeech? = null
              private var ttsReady = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  tts = TextToSpeech(this, this)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "pickFile") {
                          pendingResult = result
                          val mime = call.argument<String>("mimeType") ?: "*/*"
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              type = mime
                              addCategory(Intent.CATEGORY_OPENABLE)
                          }
                          startActivityForResult(Intent.createChooser(intent, "Select File"), PICK_CODE)
                      } else if (call.method == "synthesizeTTS") {
                          val raw = call.argument<String>("text") ?: ""
                          val spd = call.argument<Double>("speed") ?: 1.0
                          val outPath = call.argument<String>("outputPath") ?: ""
                          if (raw.isEmpty() || outPath.isEmpty() || !ttsReady || tts == null) {
                              result.error("TTS_ERR", "TTS not ready or empty text", null)
                              return@setMethodCallHandler
                          }
                          val txt = if (raw.length > 3900) raw.substring(0, 3900) else raw
                          tts?.setSpeechRate(spd.toFloat())
                          val dest = File(outPath)
                          dest.parentFile?.mkdirs()
                          val uid = "WY_" + System.currentTimeMillis()
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(id: String?) {}
                              override fun onDone(id: String?) { runOnUiThread { result.success(dest.absolutePath) } }
                              override fun onError(id: String?) { runOnUiThread { result.error("ERR", "Synth failed", null) } }
                          })
                          val st = tts?.synthesizeToFile(txt, Bundle(), dest, uid)
                          if (st != TextToSpeech.SUCCESS) result.error("FAIL", "Synth call failed", null)
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale.US
                      ttsReady = true
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_CODE) {
                      val res = pendingResult
                      pendingResult = null
                      if (resultCode == Activity.RESULT_OK && data?.data != null) {
                          val uri: Uri = data.data!!
                          try {
                              var name = "selected_media"
                              contentResolver.query(uri, null, null, null, null)?.use { c ->
                                  val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  if (idx != -1 && c.moveToFirst()) name = c.getString(idx) ?: "selected_media"
                              }
                              val out = File(cacheDir, name)
                              contentResolver.openInputStream(uri)?.use { inp ->
                                  FileOutputStream(out).use { o -> inp.copyTo(o) }
                              }
                              val map = HashMap<String, String>()
                              map["name"] = name
                              map["path"] = out.absolutePath
                              res?.success(map)
                          } catch (e: Exception) {
                              res?.error("READ_ERR", e.localizedMessage, null)
                          }
                      } else {
                          res?.success(null)
                      }
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          """

          for mf in glob.glob('android/**/MainActivity.kt', recursive=True):
              with open(mf, 'r') as f:
                  fl = f.readline().strip()
              if not fl.startswith('package '):
                  fl = 'package com.waiyan.burmesepodcast.burmese_podcast'
              with open(mf, 'w') as f:
                  f.write(fl + "\n\n" + kt)

          def make_png(sz):
              raw = bytearray()
              for y in range(sz):
                  raw.append(0)
                  ny = (y + 0.5) / sz
                  for x in range(sz):
                      nx = (x + 0.5) / sz
                      dx, dy = nx - 0.5, ny - 0.5
                      d = (dx*dx + dy*dy) ** 0.5
                      if d > 0.47:
                          raw.extend((0, 0, 0, 0))
                      elif d >= 0.43:
                          raw.extend((212, 175, 55, 255))
                      else:
                          cap = (abs(dx) <= 0.08 and 0.27 <= ny <= 0.46) or ((dx*dx + (ny-0.27)**2) <= 0.0064) or ((dx*dx + (ny-0.46)**2) <= 0.0064)
                          dc = (dx*dx + (ny-0.45)**2) ** 0.5
                          arc = (0.135 <= dc <= 0.168) and (ny >= 0.45)
                          stm = (abs(dx) <= 0.02) and (0.60 <= ny <= 0.74)
                          bas = (abs(dx) <= 0.12) and (0.72 <= ny <= 0.76)
                          raw.extend((212, 175, 55, 255) if (cap or arc or stm or bas) else (24, 24, 28, 255))
              def chk(t, d):
                  return struct.pack("!I", len(d)) + t + d + struct.pack("!I", zlib.crc32(t + d) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + chk(b"IHDR", struct.pack("!IIBBBBB", sz, sz, 8, 6, 0, 0, 0)) + chk(b"IDAT", zlib.compress(bytes(raw), 9)) + chk(b"IEND", b"")

          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, sz in sizes.items():
              p = os.path.join('android/app/src/main/res', folder)
              os.makedirs(p, exist_ok=True)
              pb = make_png(sz)
              for fn in ('ic_launcher.png', 'ic_launcher_round.png', 'wy_launcher.png'):
                  with open(os.path.join(p, fn), 'wb') as f:
                      f.write(pb)
          EOF

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build Debug APK (ARM64)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Prepare Single APK
        run: |
          mkdir -p output_apk
          cp build/app/outputs/flutter-apk/app-debug.apk output_apk/WY-Podcast.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wys-podcast-apk
          path: output_apk/WY-Podcast.apk
          compression-level: 0

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest output_apk/WY-Podcast.apk --title "WY's PODCAST APK" --notes "WY-Podcast.apk ကို တိုက်ရိုက် ဒေါင်းလုဒ်ဆွဲနိုင်ပါပြီ။"
