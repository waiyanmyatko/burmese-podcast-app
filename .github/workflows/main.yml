name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Folder
        run: |
          flutter create . --platforms=android --org com.waiyan.burmesepodcast

      - name: Configure Android SDK, NDK & Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479791eab51dcfd5987e8701e6b0e826" > "$ANDROID_HOME/licenses/android-sdk-license"
          
          # Fix minSdk, compileSdk and targetSdk
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle || true

      - name: Download Whisper Offline Model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build and Print Direct Error
        run: |
          set +e
          flutter build apk --debug > build_raw.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=================== DETAILED ERROR START ==================="
            grep -E -C 2 -i "(error:|fatal|failed to|compilation error|exception)" build_raw.log | head -n 40
            echo "============================================================"
            echo "=== LAST 30 LINES OF LOG ==="
            tail -n 30 build_raw.log
            exit $STATUS
          fi

      - name: Prepare APK for Artifact
        if: always()
        run: |
          mkdir -p output_apk
          find build/ -name "*.apk" -type f -exec cp {} output_apk/ \; || true
          find android/ -name "*.apk" -type f -exec cp {} output_apk/ \; || true
          ls -la output_apk/

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burmese-podcast-app
          path: output_apk/
