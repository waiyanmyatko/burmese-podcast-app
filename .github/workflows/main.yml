name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean & Recreate Android Project Folder
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.waiyan.burmesepodcast

      - name: Configure Android SDK 36, minSdk 24 & Licenses
        run: |
          for SDK_DIR in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/usr/local/lib/android/sdk"; do
            if [ -d "$SDK_DIR" ]; then
              mkdir -p "$SDK_DIR/licenses"
              printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479791eab51dcfd5987e8701e6b0e826" > "$SDK_DIR/licenses/android-sdk-license"
              printf "84831b9409646a33ee13ef6102140781e0479965" > "$SDK_DIR/licenses/android-sdk-preview-license"
            fi
          done
          yes | flutter doctor --android-licenses || true

          # Update compileSdk to 36 and minSdk to 24 in both Groovy and Kotlin Gradle files
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$f"
              sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$f"
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$f"
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' "$f"
              sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' "$f"
              sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/g' "$f"
            fi
          done

      - name: Download Whisper Offline Model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build and Print Direct Error
        run: |
          set +e
          flutter build apk --debug > build_raw.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "=================== DETAILED ERROR START ==================="
            grep -E -C 4 -i "(error:|fatal|failed to|requires libraries|compileSdk|minSdk)" build_raw.log | head -n 50
            echo "============================================================"
            tail -n 30 build_raw.log
            exit $STATUS
          fi

      - name: Prepare APK for Artifact
        run: |
          mkdir -p output_apk
          find build/ -name "*.apk" -type f -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burmese-podcast-app
          path: output_apk/
