name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Fast Whisper JNI and Configure Android
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil cmake ninja-build
          mkdir -p assets/models
          curl -L -o assets/models/ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          rm -rf android test pubspec.lock

          cat << 'EOF' > pubspec.yaml
          name: burmese_podcast
          description: WY Podcast
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          flutter:
            uses-material-design: true
            assets:
              - assets/models/ggml-tiny.bin
          EOF

          flutter pub get
          flutter create . --platforms=android --org com.waiyan.burmesepodcast
          sed -i 's/android:label="burmese_podcast"/android:label="WY'\''s PODCAST"/g' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi*
          rm -f android/app/src/main/res/drawable*/ic_launcher*

          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          mp = 'android/app/src/main/AndroidManifest.xml'
          with open(mp, 'r') as f:
              txt = f.read()
          perm = '<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.WAKE_LOCK"/><application'
          with open(mp, 'w') as f:
              f.write(txt.replace('<application', perm, 1))

          im = Image.new('RGB', (512, 512), (212, 175, 55))
          dr = ImageDraw.Draw(im)
          dr.ellipse((22, 22, 490, 490), fill=(24, 22, 18), outline=(255, 220, 95), width=16)
          dr.rounded_rectangle((200, 95, 312, 275), radius=56, fill=(245, 205, 70))
          dr.arc((155, 145, 357, 335), start=0, end=180, fill=(245, 205, 70), width=22)
          dr.rectangle((244, 330, 268, 405), fill=(245, 205, 70))
          dr.rounded_rectangle((176, 395, 336, 422), radius=12, fill=(245, 205, 70))

          flt = getattr(Image, 'Resampling', Image).LANCZOS
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for d, s in sizes.items():
              p = os.path.join('android/app/src/main/res', d)
              os.makedirs(p, exist_ok=True)
              im.resize((s, s), flt).save(os.path.join(p, 'ic_launcher.png'), 'PNG')
          PYEOF

          git clone --depth 1 --branch v1.5.4 https://github.com/ggerganov/whisper.cpp.git /tmp/wcpp
          cat << 'CPPEOF' > /tmp/wcpp/whisper_jni.cpp
          #include <jni.h>
          #include <string>
          #include "whisper.h"

          static struct whisper_context *g_ctx = nullptr;
          static std::string g_loaded_path = "";

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_waiyan_whisper_WhisperBridge_transcribe(
              JNIEnv *env, jclass, jstring model_path_j, jfloatArray pcm_j) {
              const char *model_path = env->GetStringUTFChars(model_path_j, nullptr);
              if (!g_ctx || g_loaded_path != model_path) {
                  if (g_ctx) whisper_free(g_ctx);
                  struct whisper_context_params cparams = whisper_context_default_params();
                  g_ctx = whisper_init_from_file_with_params(model_path, cparams);
                  g_loaded_path = model_path;
              }
              env->ReleaseStringUTFChars(model_path_j, model_path);
              if (!g_ctx) return env->NewStringUTF("");

              jsize n_samples = env->GetArrayLength(pcm_j);
              jfloat *pcm_data = env->GetFloatArrayElements(pcm_j, nullptr);

              struct whisper_full_params wparams = whisper_full_default_params(WHISPER_SAMPLING_GREEDY);
              wparams.print_progress = false;
              wparams.print_special = false;
              wparams.print_realtime = false;
              wparams.print_timestamps = false;
              wparams.single_segment = false;
              wparams.no_context = true;
              wparams.greedy.best_of = 1;
              wparams.temperature_inc = 0.0f;
              wparams.n_threads = 6;

              std::string out_text = "";
              if (whisper_full(g_ctx, wparams, pcm_data, n_samples) == 0) {
                  int n_seg = whisper_full_n_segments(g_ctx);
                  for (int i = 0; i < n_seg; ++i) {
                      const char *seg = whisper_full_get_segment_text(g_ctx, i);
                      if (seg) out_text += seg;
                  }
              }
              env->ReleaseFloatArrayElements(pcm_j, pcm_data, JNI_ABORT);
              return env->NewStringUTF(out_text.c_str());
          }
          CPPEOF

          printf "\nadd_compile_options(-O3 -ffast-math -funroll-loops -DNDEBUG)\nadd_library(whisper_jni SHARED whisper_jni.cpp)\ntarget_link_libraries(whisper_jni PRIVATE whisper log android)\n" >> /tmp/wcpp/CMakeLists.txt

          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          cmake -GNinja -B /tmp/wcpp/build -S /tmp/wcpp \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/wcpp/build --target whisper_jni -j4
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp /tmp/wcpp/build/libwhisper_jni.so android/app/src/main/jniLibs/arm64-v8a/libwhisper_jni.so

          KT_FILE=$(find android -name "MainActivity.kt" | head -n 1)
          KT_DIR=$(dirname "$KT_FILE")
          PKG_LINE=$(grep "^package " "$KT_FILE" || echo "package com.waiyan.burmesepodcast")

          cat << 'WBEOF' > "$KT_DIR/WhisperBridge.kt"
          package com.waiyan.whisper

          object WhisperBridge {
              init { System.loadLibrary("whisper_jni") }
              @JvmStatic external fun transcribe(modelPath: String, samples: FloatArray): String
          }
          WBEOF

          echo "$PKG_LINE" > "$KT_FILE"
          cat << 'KTEOF' >> "$KT_FILE"
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.view.WindowManager
          import com.waiyan.whisper.WhisperBridge
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          class MainActivity: FlutterActivity() {
              private val chName = "com.waiyan.burmesepodcast/file_picker"
              private var pendingRes: MethodChannel.Result? = null
              private var player: MediaPlayer? = null
              private var loadedPath: String = ""
              private var channel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, chName)
                  channel?.setMethodCallHandler { call, res ->
                      val prefs = getSharedPreferences("wy_prefs", Context.MODE_PRIVATE)
                      when (call.method) {
                          "loadPrefs" -> {
                              res.success(mapOf(
                                  "apiKey" to (prefs.getString("apiKey", "") ?: ""),
                                  "style" to (prefs.getString("style", "") ?: ""),
                                  "voice" to (prefs.getString("voice", "") ?: ""),
                                  "speed" to prefs.getFloat("speed", 1.0f).toDouble(),
                                  "useGem" to prefs.getBoolean("useGem", false),
                                  "gemMode" to (prefs.getString("gemMode", "For Point") ?: "For Point")
                              ))
                          }
                          "savePrefs" -> {
                              prefs.edit()
                                  .putString("apiKey", call.argument<String>("apiKey") ?: "")
                                  .putString("style", call.argument<String>("style") ?: "")
                                  .putString("voice", call.argument<String>("voice") ?: "")
                                  .putFloat("speed", (call.argument<Double>("speed") ?: 1.0).toFloat())
                                  .putBoolean("useGem", call.argument<Boolean>("useGem") ?: false)
                                  .putString("gemMode", call.argument<String>("gemMode") ?: "For Point")
                                  .commit()
                              res.success(true)
                          }
                          "prepareModel" -> {
                              Thread {
                                  try {
                                      val outModel = File(filesDir, "ggml-tiny.bin")
                                      if (!outModel.exists() || outModel.length() < 10000000L) {
                                          assets.open("flutter_assets/assets/models/ggml-tiny.bin").use { inp ->
                                              FileOutputStream(outModel).use { out -> inp.copyTo(out) }
                                          }
                                      }
                                      runOnUiThread { res.success(outModel.absolutePath) }
                                  } catch (e: Exception) {
                                      runOnUiThread { res.error("MODEL_ERR", e.localizedMessage, null) }
                                  }
                              }.start()
                          }
                          "pickFile" -> {
                              pendingRes = res
                              val mime = call.argument<String>("mimeType") ?: "*/*"
                              val i = Intent(Intent.ACTION_GET_CONTENT).apply {
                                  type = mime
                                  addCategory(Intent.CATEGORY_OPENABLE)
                              }
                              startActivityForResult(Intent.createChooser(i, "Select File"), 9001)
                          }
                          "transcribeOffline" -> {
                              val p = call.argument<String>("path") ?: ""
                              val mp = call.argument<String>("modelPath") ?: File(filesDir, "ggml-tiny.bin").absolutePath
                              Thread {
                                  try {
                                      runOnUiThread { channel?.invokeMethod("updateProgress", "အသံဖိုင်ကို စတင်ခွဲခြမ်းနေပါသည်...") }
                                      val chunks = decodeTo16kFloatChunks(p)
                                      val sb = StringBuilder()
                                      for (i in chunks.indices) {
                                          runOnUiThread { channel?.invokeMethod("updateProgress", "Offline Whisper Processing: အပိုင်း (${i + 1} / ${chunks.size}) ကို စာသားထုတ်နေပါသည်...\n\n(ဖုန်း Screen မပိတ်သွားစေရန် ဖွင့်ထားပေးပါ)") }
                                          val txt = WhisperBridge.transcribe(mp, chunks[i]).trim()
                                          if (txt.isNotEmpty()) {
                                              sb.append(txt).append(" ")
                                          }
                                      }
                                      val finalTxt = sb.toString().trim()
                                      runOnUiThread {
                                          if (finalTxt.isNotEmpty()) res.success(finalTxt)
                                          else res.error("EMPTY", "အသံဖိုင်မှ စာသား မထွက်လာပါ", null)
                                      }
                                  } catch (e: Exception) {
                                      runOnUiThread { res.error("STT_ERR", e.localizedMessage ?: "Decode Error", null) }
                                  }
                              }.start()
                          }
                          "saveAudio" -> {
                              val bytes = call.argument<ByteArray>("bytes")
                              val ext = call.argument<String>("ext") ?: "wav"
                              Thread {
                                  try {
                                      if (bytes == null || bytes.isEmpty()) throw Exception("Empty audio bytes")
                                      val fn = "WY_Podcast_" + System.currentTimeMillis() + "." + ext
                                      val lf = File(cacheDir, fn).apply { writeBytes(bytes) }
                                      val pub = saveDl(lf, fn, "audio/" + ext)
                                      runOnUiThread { res.success(mapOf("local" to lf.absolutePath, "public" to pub)) }
                                  } catch (e: Exception) {
                                      runOnUiThread { res.error("SAVE_ERR", e.localizedMessage, null) }
                                  }
                              }.start()
                          }
                          "playAudio" -> {
                              val p = call.argument<String>("path") ?: ""
                              try {
                                  if (player != null && loadedPath == p) {
                                      player?.start()
                                  } else {
                                      player?.release()
                                      loadedPath = p
                                      player = MediaPlayer().apply {
                                          setDataSource(p)
                                          prepare()
                                          start()
                                      }
                                  }
                                  res.success(mapOf("dur" to (player?.duration ?: 0), "pos" to (player?.currentPosition ?: 0)))
                              } catch (e: Exception) { res.error("PLAY", e.localizedMessage, null) }
                          }
                          "pauseAudio" -> {
                              try { player?.pause() } catch (_: Exception) {}
                              res.success(true)
                          }
                          "stopAudio" -> {
                              try {
                                  player?.stop()
                                  player?.release()
                                  player = null
                                  loadedPath = ""
                              } catch (_: Exception) {}
                              res.success(true)
                          }
                          "seekAudio" -> {
                              val ms = call.argument<Int>("pos") ?: 0
                              try { player?.seekTo(ms) } catch (_: Exception) {}
                              res.success(true)
                          }
                          "audioState" -> {
                              val playing = try { player?.isPlaying ?: false } catch (_: Exception) { false }
                              val pos = try { player?.currentPosition ?: 0 } catch (_: Exception) { 0 }
                              val dur = try { player?.duration ?: 0 } catch (_: Exception) { 0 }
                              res.success(mapOf("playing" to playing, "pos" to pos, "dur" to dur))
                          }
                          else -> res.notImplemented()
                      }
                  }
              }

              private fun decodeTo16kFloatChunks(inPath: String): List<FloatArray> {
                  val ex = MediaExtractor().apply { setDataSource(inPath) }
                  var idx = -1
                  var fmt: MediaFormat? = null
                  for (i in 0 until ex.trackCount) {
                      val f = ex.getTrackFormat(i)
                      if ((f.getString(MediaFormat.KEY_MIME) ?: "").startsWith("audio/")) {
                          idx = i; fmt = f; break
                      }
                  }
                  if (idx < 0 || fmt == null) throw Exception("Audio track ရှာမတွေ့ပါ")
                  ex.selectTrack(idx)
                  val dec = MediaCodec.createDecoderByType(fmt.getString(MediaFormat.KEY_MIME)!!)
                  dec.configure(fmt, null, null, 0)
                  dec.start()
                  var sr = if (fmt.containsKey(MediaFormat.KEY_SAMPLE_RATE)) fmt.getInteger(MediaFormat.KEY_SAMPLE_RATE) else 44100
                  var ch = if (fmt.containsKey(MediaFormat.KEY_CHANNEL_COUNT)) fmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT) else 1
                  
                  val chunks = java.util.ArrayList<FloatArray>()
                  val chunkSize = 16000 * 60 * 3 
                  var currentChunk = FloatArray(chunkSize)
                  var count = 0
                  
                  val info = MediaCodec.BufferInfo()
                  var done = false
                  while (!done) {
                      val inIdx = dec.dequeueInputBuffer(10000)
                      if (inIdx >= 0) {
                          val b = dec.getInputBuffer(inIdx)!!
                          val sz = ex.readSampleData(b, 0)
                          if (sz < 0) dec.queueInputBuffer(inIdx, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                          else { dec.queueInputBuffer(inIdx, 0, sz, ex.sampleTime, 0); ex.advance() }
                      }
                      val outIdx = dec.dequeueOutputBuffer(info, 10000)
                      if (outIdx >= 0) {
                          val b = dec.getOutputBuffer(outIdx)!!
                          if (info.size > 0) {
                              val chunkBytes = ByteArray(info.size)
                              b.get(chunkBytes); b.clear()
                              val sb = ByteBuffer.wrap(chunkBytes).order(ByteOrder.LITTLE_ENDIAN).asShortBuffer()
                              val frames = sb.remaining() / ch
                              val step = sr.toDouble() / 16000.0
                              var pos = 0.0
                              val invCh = 1.0f / (32768.0f * ch.toFloat())
                              while (pos.toInt() < frames) {
                                  val base = pos.toInt() * ch
                                  var sum = 0
                                  for (c in 0 until ch) {
                                      if (base + c < sb.limit()) sum += sb.get(base + c).toInt()
                                  }
                                  
                                  if (count >= chunkSize) {
                                      chunks.add(currentChunk)
                                      currentChunk = FloatArray(chunkSize)
                                      count = 0
                                  }
                                  currentChunk[count++] = sum.toFloat() * invCh
                                  pos += step
                              }
                          }
                          dec.releaseOutputBuffer(outIdx, false)
                          if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) done = true
                      } else if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          val nf = dec.outputFormat
                          if (nf.containsKey(MediaFormat.KEY_SAMPLE_RATE)) sr = nf.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                          if (nf.containsKey(MediaFormat.KEY_CHANNEL_COUNT)) ch = nf.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                      }
                  }
                  dec.stop(); dec.release(); ex.release()
                  if (count > 0) chunks.add(currentChunk.copyOf(count))
                  return chunks
              }

              private fun saveDl(src: File, fn: String, mime: String): String {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val cv = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, fn)
                              put(MediaStore.Downloads.MIME_TYPE, mime)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                          }
                          val u = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)
                          if (u != null) {
                              contentResolver.openOutputStream(u)?.use { o -> src.inputStream().use { it.copyTo(o) } }
                              return "/storage/emulated/0/Download/" + fn
                          }
                      }
                      src.absolutePath
                  } catch (_: Exception) { src.absolutePath }
              }

              override fun onActivityResult(req: Int, code: Int, data: Intent?) {
                  super.onActivityResult(req, code, data)
                  if (req == 9001) {
                      val r = pendingRes; pendingRes = null
                      if (code == Activity.RESULT_OK && data?.data != null) {
                          val u = data.data!!
                          try {
                              var n = "selected_file"
                              contentResolver.query(u, null, null, null, null)?.use { c ->
                                  val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  if (i != -1 && c.moveToFirst()) n = c.getString(i) ?: "selected_file"
                              }
                              val safeName = n.replace(Regex("[^a-zA-Z0-9._-]"), "_")
                              val f = File(cacheDir, safeName)
                              contentResolver.openInputStream(u)?.use { inp -> FileOutputStream(f).use { inp.copyTo(it) } }
                              r?.success(mapOf("name" to n, "path" to f.absolutePath))
                          } catch (e: Exception) {
                              r?.error("READ_ERR", e.localizedMessage, null)
                          }
                      } else r?.success(null)
                  }
              }

              override fun onDestroy() { player?.release(); super.onDestroy() }
          }
          KTEOF

      - name: Build Debug ARM64 APK
        run: |
          flutter build apk --debug --target-platform android-arm64
          mkdir -p out_apk
          cp build/app/outputs/flutter-apk/app-debug.apk out_apk/WY-Podcast.apk

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wys-podcast-apk
          path: out_apk/WY-Podcast.apk
          compression-level: 0

      - name: Publish Direct APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out_apk/WY-Podcast.apk --title "WY's PODCAST APK" --notes "Direct APK Download"
# === END OF FILE ===
