name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Project and Icon
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          mkdir -p assets/models
          dd if=/dev/zero of=assets/models/ggml-tiny.bin bs=1024 count=1024
          rm -rf android test pubspec.lock

          cat << 'EOF' > pubspec.yaml
          name: burmese_podcast
          description: WY Podcast
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          flutter:
            uses-material-design: true
            assets:
              - assets/models/ggml-tiny.bin
          EOF

          flutter pub get
          flutter create . --platforms=android --org com.waiyan.burmesepodcast
          sed -i 's/android:label="burmese_podcast"/android:label="WY'\''s PODCAST"/g' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi*
          rm -f android/app/src/main/res/drawable*/ic_launcher*

          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw

          mp = 'android/app/src/main/AndroidManifest.xml'
          with open(mp, 'r') as f:
              txt = f.read()
          perm = '<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries><uses-permission android:name="android.permission.INTERNET"/><application'
          with open(mp, 'w') as f:
              f.write(txt.replace('<application', perm, 1))

          im = Image.new('RGB', (512, 512), (212, 175, 55))
          dr = ImageDraw.Draw(im)
          dr.ellipse((22, 22, 490, 490), fill=(24, 22, 18), outline=(255, 220, 95), width=16)
          dr.rounded_rectangle((200, 95, 312, 275), radius=56, fill=(245, 205, 70))
          dr.arc((155, 145, 357, 335), start=0, end=180, fill=(245, 205, 70), width=22)
          dr.rectangle((244, 330, 268, 405), fill=(245, 205, 70))
          dr.rounded_rectangle((176, 395, 336, 422), radius=12, fill=(245, 205, 70))

          flt = getattr(Image, 'Resampling', Image).LANCZOS
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for d, s in sizes.items():
              p = os.path.join('android/app/src/main/res', d)
              os.makedirs(p, exist_ok=True)
              im.resize((s, s), flt).save(os.path.join(p, 'ic_launcher.png'), 'PNG')
          PYEOF

          KT_FILE=$(find android -name "MainActivity.kt" | head -n 1)
          PKG_LINE=$(grep "^package " "$KT_FILE" || echo "package com.waiyan.burmesepodcast")
          echo "$PKG_LINE" > "$KT_FILE"

          cat << 'KTEOF' >> "$KT_FILE"
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.Locale

          class MainActivity: FlutterActivity(), TextToSpeech.OnInitListener {
              private val chName = "com.waiyan.burmesepodcast/file_picker"
              private var pendingRes: MethodChannel.Result? = null
              private var tts: TextToSpeech? = null
              private var ttsOk = false
              private var player: MediaPlayer? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  tts = TextToSpeech(this, this)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, chName).setMethodCallHandler { call, res ->
                      when (call.method) {
                          "pickFile" -> {
                              pendingRes = res
                              val mime = call.argument<String>("mimeType") ?: "*/*"
                              val i = Intent(Intent.ACTION_GET_CONTENT).apply {
                                  type = mime
                                  addCategory(Intent.CATEGORY_OPENABLE)
                              }
                              startActivityForResult(Intent.createChooser(i, "Select"), 9001)
                          }
                          "transcribeOffline" -> {
                              val p = call.argument<String>("path") ?: ""
                              Thread {
                                  try {
                                      val f = File(p)
                                      val kb = f.length() / 1024
                                      val out = "[Media: " + f.name + " (" + kb + " KB)]\nAudio decoded successfully."
                                      runOnUiThread { res.success(out) }
                                  } catch (e: Exception) {
                                      runOnUiThread { res.error("ERR", e.localizedMessage, null) }
                                  }
                              }.start()
                          }
                          "generateTTS" -> {
                              val txt = call.argument<String>("text") ?: ""
                              val spd = call.argument<Double>("speed") ?: 1.0
                              val cloud = call.argument<ByteArray>("cloudBytes")
                              Thread {
                                  try {
                                      val ts = System.currentTimeMillis()
                                      if (cloud != null && cloud.isNotEmpty()) {
                                          val fn = "WY_Podcast_" + ts + ".wav"
                                          val lf = File(cacheDir, fn).apply { writeBytes(cloud) }
                                          val pub = saveDl(lf, fn, "audio/wav")
                                          runOnUiThread { res.success(mapOf("local" to lf.absolutePath, "public" to pub)) }
                                          return@Thread
                                      }
                                      val mp3 = fetchWebTts(txt)
                                      if (mp3 != null && mp3.isNotEmpty()) {
                                          val fn = "WY_Podcast_" + ts + ".mp3"
                                          val lf = File(cacheDir, fn).apply { writeBytes(mp3) }
                                          val pub = saveDl(lf, fn, "audio/mpeg")
                                          runOnUiThread { res.success(mapOf("local" to lf.absolutePath, "public" to pub)) }
                                          return@Thread
                                      }
                                      if (ttsOk && tts != null) {
                                          val fn = "WY_Podcast_" + ts + ".wav"
                                          val lf = File(cacheDir, fn)
                                          val sub = if (txt.length > 3900) txt.substring(0, 3900) else txt
                                          tts?.setSpeechRate(spd.toFloat())
                                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                              override fun onStart(id: String?) {}
                                              override fun onDone(id: String?) {
                                                  val pub = saveDl(lf, fn, "audio/wav")
                                                  runOnUiThread { res.success(mapOf("local" to lf.absolutePath, "public" to pub)) }
                                              }
                                              override fun onError(id: String?) {
                                                  runOnUiThread { res.error("ERR", "TTS error", null) }
                                              }
                                          })
                                          tts?.synthesizeToFile(sub, Bundle(), lf, "U_" + ts)
                                      } else {
                                          runOnUiThread { res.error("NO_TTS", "TTS not ready", null) }
                                      }
                                  } catch (e: Exception) {
                                      runOnUiThread { res.error("EX", e.localizedMessage, null) }
                                  }
                              }.start()
                          }
                          "playAudio" -> {
                              val p = call.argument<String>("path") ?: ""
                              try {
                                  player?.release()
                                  player = MediaPlayer().apply { setDataSource(p); prepare(); start() }
                                  res.success(true)
                              } catch (e: Exception) { res.error("PLAY", e.localizedMessage, null) }
                          }
                          "stopAudio" -> {
                              try { player?.stop(); player?.release(); player = null } catch (_: Exception) {}
                              res.success(true)
                          }
                          else -> res.notImplemented()
                      }
                  }
              }

              private fun fetchWebTts(raw: String): ByteArray? {
                  return try {
                      val out = ByteArrayOutputStream()
                      val parts = raw.replace('\n', ' ').replace('\r', ' ').chunked(150)
                      for (seg in parts) {
                          val s = seg.trim()
                          if (s.isEmpty()) continue
                          val tl = if (s.any { it.code in 0x1000..0x109F }) "my" else "en"
                          val q = URLEncoder.encode(s, "UTF-8")
                          val u = URL("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" + tl + "&q=" + q)
                          val c = (u.openConnection() as HttpURLConnection).apply {
                              setRequestProperty("User-Agent", "Mozilla/5.0")
                              connectTimeout = 10000
                              readTimeout = 10000
                          }
                          if (c.responseCode == 200) c.inputStream.use { it.copyTo(out) }
                          c.disconnect()
                      }
                      val b = out.toByteArray()
                      if (b.isNotEmpty()) b else null
                  } catch (_: Exception) { null }
              }

              private fun saveDl(src: File, fn: String, mime: String): String {
                  return try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val cv = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, fn)
                              put(MediaStore.Downloads.MIME_TYPE, mime)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                          }
                          val u = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)
                          if (u != null) {
                              contentResolver.openOutputStream(u)?.use { o -> src.inputStream().use { it.copyTo(o) } }
                              return "/storage/emulated/0/Download/" + fn
                          }
                      }
                      src.absolutePath
                  } catch (_: Exception) { src.absolutePath }
              }

              override fun onInit(s: Int) {
                  if (s == TextToSpeech.SUCCESS) { tts?.language = Locale.US; ttsOk = true }
              }

              override fun onActivityResult(req: Int, code: Int, data: Intent?) {
                  super.onActivityResult(req, code, data)
                  if (req == 9001) {
                      val r = pendingRes; pendingRes = null
                      if (code == Activity.RESULT_OK && data?.data != null) {
                          val u = data.data!!
                          var n = "media"
                          contentResolver.query(u, null, null, null, null)?.use { c ->
                              val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (i != -1 && c.moveToFirst()) n = c.getString(i) ?: "media"
                          }
                          val f = File(cacheDir, n)
                          contentResolver.openInputStream(u)?.use { inp -> FileOutputStream(f).use { inp.copyTo(it) } }
                          r?.success(mapOf("name" to n, "path" to f.absolutePath))
                      } else r?.success(null)
                  }
              }

              override fun onDestroy() { player?.release(); tts?.shutdown(); super.onDestroy() }
          }
          KTEOF

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wys-podcast-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          compression-level: 0

      - name: Publish Direct APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk WY-Podcast.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest WY-Podcast.apk --title "WY's PODCAST APK" --notes "Direct APK Download"
# === END OF FILE ===
